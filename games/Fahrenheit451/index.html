<style>
    * {
        margin: 0;

    body {
        background: #1a1a1a;

        font-family: Arial, sans-serif;
        height: 100vh;
        overflow: hidden;
    }

    .header {
        height: 60px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 20px;
        background: #222;
        border-bottom: 1px solid #333;
    }

    .header h1 {
        font-size: 18px;
        font-weight: 600;
    }

    .header a {
        color: #aaa;
        text-decoration: none;
        font-size: 14px;
        transition: color 0.2s;
    }

    .header a:hover {
        color: white;
    }

    iframe {
        width: 100%;
        height: calc(100vh - 60px);
        border: none;
        display: block;
        background: #1a1a1a;
    }
</style>
