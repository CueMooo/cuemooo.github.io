<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game Hub</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎮</text></svg>">
</head>
<body>
  <header>
    <div class="container header-content">
      <h1 class="logo">🎮 Game Hub</h1>
      <nav>
        <button class="nav-btn active" data-tab="games">Games</button>
        <button class="nav-btn" data-tab="about">About</button>
      </nav>
    </div>
  </header>

  <main class="container">
    <section id="games" class="tab-content active">
      <div class="controls">
        <input type="text" id="search" placeholder="Search games..." autocomplete="off">
        <select id="category-filter">
          <option value="all">All Categories</option>
        </select>
      </div>
      <div id="games-grid" class="games-grid"></div>
      <p id="no-results" class="no-results hidden">No games found.</p>
    </section>

    <section id="about" class="tab-content">
      <div class="about-card">
        <h2>About This Site</h2>
        <p>Simple static Game Hub. All games are local under <code>/games/</code>.</p>
        <p>To add a game: create <code>games/yourgame/index.html</code> then add it to <code>games.json</code>.</p>
      </div>
    </section>
  </main>
