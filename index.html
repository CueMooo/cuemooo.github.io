<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>THE LOCKER</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@400;600&family=Outfit:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="noise"></div>
  <div class="rivets"></div>

  <header class="top">
    <div class="lock" aria-hidden="true">
      <div class="dial">
        <span>24</span>
        <b></b>
        <span>08</span>
      </div>
    </div>
    <div>
      <p class="kicker">Combination unknown</p>
      <h1>THE LOCKER</h1>
      <p class="tag">Devin’s private stack of games. Crack a door.</p>
    </div>
  </header>

  <section class="toolbar">
    <input id="search" type="search" placeholder="Search games…" autocomplete="off" />
    <div class="filters" id="filters"></div>
  </section>

  <main id="grid" class="grid"></main>

  <footer>
    <span>№ 247</span>
    <span>property of slifer</span>
    <span>do not slam</span>
  </footer>
  <script src="script.js"></script>
</body>
</html>
